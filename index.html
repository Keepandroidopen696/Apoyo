<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEZA YORK - Conciencia V4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#1a1a1a;font-family:system-ui,sans-serif;min-height:100vh}
#anuncioNeza{display:none;position:fixed;top:0;left:0;right:0;background:#ffeb00;color:#000;padding:12px;text-align:center;font-weight:800;z-index:9999;font-size:12px;border-bottom:3px solid #000}
header{padding:60px 20px 10px;text-align:center}header h1{font-size:28px;margin:0}header h1 span{background:#ffeb00;padding:2px 8px;border-radius:6px}
.wrap{max-width:460px;margin:0 auto;padding:12px 16px 40px}
.card{background:#fff;border:1px solid #e9e6e0;border-radius:18px;padding:16px;margin:12px 0}
.label{font-size:11px;font-weight:800;color:#999;margin-bottom:8px}
textarea{width:100%;border:1px solid #e5e2dc;border-radius:12px;padding:12px;font-size:14px;min-height:90px;resize:none}
button{border:none;border-radius:20px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer}
.primary{background:#111;color:#ffeb00}.ghost{background:#f0ede8;color:#555;border:1px solid #e5e2dc}.danger{background:#ff3b30;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chat{max-height:340px;overflow-y:auto}
.msg{padding:10px 12px;border-radius:14px;margin:6px 0;font-size:13px;line-height:1.4;max-width:86%}
.msg.user{background:#111;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.bot{background:#fff;border:1px solid #e9e6e0;color:#1a1a1a;border-bottom-left-radius:4px}
.msg.bot.monse{background:#ffeb00;border:1px solid #000;font-weight:600}
.tip{font-size:12px;color:#777;line-height:1.5}
.badgeMonse{display:inline-block;background:#111;color:#ffeb00;font-size:10px;padding:3px 8px;border-radius:20px;margin-bottom:6px}
</style>
</head>
<body>
<div id="anuncioNeza"></div>
<header><h1>NEZA YORK <span>CONCIENCIA V4</span></h1><p style="color:#666;font-size:13px">Si dices Monse 3 veces, te armo el mensaje para ella. 100% local.</p></header>
<div class="wrap">
  <div class="card">
    <div class="label">CHAT - <span id="monseCount">Monse mencionada: 0/3</span> | Memoria: <span id="memCount">0</span></div>
    <div id="chat" class="chat"></div>
    <textarea id="input" placeholder="Ej: Monse me dejó de hablar..."></textarea>
    <div class="row"><button class="primary" onclick="enviar()">Enviar 🔔</button><button class="ghost" onclick="borrarMemoria()">Borrar memoria</button></div>
  </div>
</div>
<script>
const mensajeNeza="NezaOfficial: En Neza te ayudamos con problemas que tengas dándote un pequeño apoyo ya que no podemos hacer mucho ya que no somos empresa pero no se necesita ser empresa para poder ayudar. Atte:NezaOfficial";
let audioCtx; function playDing(t=1){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=t==1?880:1046;g.gain.value=0.16;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+(t==1?0.6:0.25));o.stop(audioCtx.currentTime+(t==1?0.6:0.25));if(t==1){setTimeout(()=>{let o2=audioCtx.createOscillator(),g2=audioCtx.createGain();o2.frequency.value=659;g2.gain.value=0.12;o2.connect(g2);g2.connect(audioCtx.destination);o2.start();g2.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.5);o2.stop(audioCtx.currentTime+0.5);},120);}}catch(e){}}
function mostrarAnuncio(){playDing(1);let a=document.getElementById("anuncioNeza");a.innerText=mensajeNeza;a.style.display="block";setTimeout(()=>a.style.display="none",8000);} setInterval(mostrarAnuncio,60000); setTimeout(mostrarAnuncio,5000);

let memoria = JSON.parse(localStorage.getItem('nezaMemoriaV4')||'[]');
let monseMenciones = parseInt(localStorage.getItem('nezaMonse')||'0');

function guardar(tipo, txt){memoria.push({tipo, txt, fecha:Date.now()}); if(memoria.length>30) memoria.shift(); localStorage.setItem('nezaMemoriaV4', JSON.stringify(memoria)); localStorage.setItem('nezaMonse', monseMenciones); updateUI();}
function updateUI(){document.getElementById('memCount').innerText=memoria.length; document.getElementById('monseCount').innerText=`Monse mencionada: ${monseMenciones}/3`; let c=document.getElementById('chat'); c.innerHTML=""; memoria.forEach(m=>{let d=document.createElement('div'); d.className='msg '+(m.tipo=='user'?'user': m.tipo=='monse'?'bot monse':'bot'); if(m.tipo=='monse') d.innerHTML=`<span class="badgeMonse">MENSAJE LISTO PARA MONSE</span><br>${m.txt}<br><div class="row"><button class="primary" onclick="navigator.clipboard.writeText(\`${m.txt.replace(/`/g,"'")}\`);playDing(2);alert('Copiado para Monse')">Copiar para Monse 🔔</button></div>`; else d.innerText=m.txt; c.appendChild(d);}); c.scrollTop=c.scrollHeight;}

function analizar(t){let s=t.toLowerCase();let e=[];if(s.match(/culpa|mi culpa/))e.push('culpa');if(s.match(/monse/))e.push('amistad');if(s.match(/gusta|niño|crush/))e.push('crush');if(s.match(/triste|fracas/))e.push('tristeza');if(s.match(/sola|nadie/))e.push('soledad');return e.length?e:['general'];}

function generarRespuesta(texto){
  let emos=analizar(texto);
  if(texto.toLowerCase().includes('monse')) monseMenciones++;
  
  // SI LLEGA A 3 MENCIONES DE MONSE
  if(monseMenciones>=3 && !localStorage.getItem('monseMensajeEnviado')){
    localStorage.setItem('monseMensajeEnviado','1');
    let msgMonse=`Oye Monse, sé que últimamente no te has sentido segura conmigo y que piensas que todo fue mi culpa por lo del niño que nos gustaba a las dos. No quiero pelear ni echar culpas, solo decirte que valoro mucho nuestra amistad y si te hice sentir mal, perdón. Cuando quieras hablar, aquí estoy, sin presión. - ${texto.slice(0,20)}`;
    guardar('monse', msgMonse);
    return `Ya vi que has mencionado a Monse ${monseMenciones} veces, se nota que te importa mucho. Te armé arriba un mensaje listo para mandarle, sin atacarla, sin echarle la culpa, solo para abrir la puerta. ¿Quieres que lo copie o que lo cambiemos a tu estilo?`;
  }

  if(emos.includes('amistad') && emos.includes('culpa')) return `Gracias por contarme lo de Monse. Se escucha en "${texto.slice(0,35)}..." que te estás echando toda la culpa y no todo es tu culpa. Si a las dos les gustaba el mismo morro, las dos la pasan incómodo. ¿Quieres que solo te escuche o que pensemos qué decirle?`;
  if(emos.includes('amistad')) return `Lo de Monse duele porque la amistad sí importaba. Respetar que no se sienta segura ahorita también es quererla. ¿Cómo te has sentido tú desde que se alejaron?`;
  if(emos.includes('culpa')) return `No cargues con todo sola. Una cosa es que algo no salió bien y otra es que seas mala amiga. No lo eres.`;
  if(emos.includes('tristeza')) return `Se vale sentirse así. Si sientes que fracasaste como apoyo, eso no te hace mala, te hace alguien que sí quiere ayudar. Aquí sigo.`;
  return `Gracias por contarme: "${texto.slice(0,50)}...". No necesitas tener la respuesta perfecta. A veces solo decir "aquí estoy, gracias por contarme" ya ayuda un chingo.`;
}

function enviar(){
  let inp=document.getElementById('input'); let txt=inp.value.trim(); if(!txt) return;
  playDing(2); guardar('user', txt); 
  let resp=generarRespuesta(txt);
  setTimeout(()=>{guardar('bot', resp); playDing(2);},500);
  inp.value="";
}
function borrarMemoria(){if(confirm('¿Borrar todo? Se resetea contador de Monse también')){localStorage.removeItem('nezaMemoriaV4');localStorage.removeItem('nezaMonse');localStorage.removeItem('monseMensajeEnviado');memoria=[];monseMenciones=0;updateUI();}}
document.body.addEventListener('click',()=>{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();},{once:true});
updateUI();
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}});
</script>
</body>
</html>
