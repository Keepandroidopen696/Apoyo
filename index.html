<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEZA YORK - Apoyito Mutuo</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f5f2;color:#1a1a1a;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
  #anuncioNeza{display:none;position:fixed;top:0;left:0;right:0;background:#ffeb00;color:#000;padding:12px 12px;text-align:center;font-weight:800;z-index:9999;font-size:12px;border-bottom:3px solid #000;line-height:1.3}
  header{padding:24px 20px 10px;text-align:center;padding-top:60px}
  header h1{font-size:28px;margin:0;letter-spacing:-1px}
  header h1 span{background:#ffeb00;padding:2px 8px;border-radius:6px}
  header p{color:#666;font-size:14px;max-width:380px;margin:10px auto;line-height:1.4}
  .wrap{max-width:440px;margin:0 auto;padding:12px 16px 40px}
  .card{background:#fff;border:1px solid #e9e6e0;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .label{font-size:11px;font-weight:800;letter-spacing:.8px;color:#999;margin-bottom:8px}
  textarea{width:100%;border:1px solid #e5e2dc;border-radius:12px;padding:12px;font-size:14px;min-height:90px;resize:none;font-family:inherit}
  textarea:focus{outline:none;border-color:#ffeb00;background:#fffef0}
  button{border:none;border-radius:20px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .primary{background:#111;color:#ffeb00}
  .ghost{background:#f0ede8;color:#555;border:1px solid #e5e2dc}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .resp{background:#faf8f4;border:1px solid #eee8d8;padding:12px;border-radius:12px;font-size:14px;line-height:1.5;margin-top:10px}
  .resp b{font-size:11px;color:#999;display:block;margin-bottom:4px}
  .tip{font-size:12px;color:#777;line-height:1.5}
  .neza-badge{font-size:10px;background:#111;color:#ffeb00;padding:4px 8px;border-radius:20px;display:inline-block;margin-bottom:8px}
  .footer{font-size:11px;color:#999;text-align:center;padding:20px;line-height:1.4}
</style>
</head>
<body>

<div id="anuncioNeza"></div>

<header>
  <h1>NEZA YORK <span>APOYITO</span></h1>
  <p>De Neza para Neza. Para cuando no sabes qué decir y sientes que fracasaste como apoyo emocional.</p>
</header>

<div class="wrap">
  <div class="card">
    <div class="label">1. ¿QUÉ TE CONTARON?</div>
    <textarea id="input" placeholder="Ej: Me dejó de hablar Monse..."></textarea>
    <div class="row">
      <button class="primary" onclick="generar()">Dame ideas para responder</button>
      <button class="ghost" onclick="limpiar()">Borrar</button>
    </div>
  </div>
  <div class="card" id="result" style="display:none">
    <div class="neza-badge">RESPUESTAS QUE SÍ AYUDAN</div>
    <div id="respuestas"></div>
  </div>
  <div class="card">
    <div class="label">FRASES SALVAVIDAS</div>
    <div class="row">
      <button class="ghost" onclick="copiar('Gracias por contarme esto, sé que no es fácil')">Gracias por contarme</button>
      <button class="ghost" onclick="copiar('Se escucha que te dolió mucho, no es que todo sea tu culpa')">No es tu culpa</button>
      <button class="ghost" onclick="copiar('¿Quieres que solo te escuche o que pensemos qué hacer?')">¿Escucho o ayudo?</button>
      <button class="ghost" onclick="copiar('Aquí estoy, aunque no sepa qué decir. No estás sola')">Aquí estoy</button>
    </div>
  </div>
  <div class="footer">Hecho en Neza York 600 - No somos empresa pero no se necesita ser empresa para ayudar. SAPTEL 800-911-2000</div>
</div>

<script>
const mensajeNeza = "NezaOfficial: En Neza te ayudamos con problemas que tengas dándote un pequeño apoyo ya que no podemos hacer mucho ya que no somos empresa pero no se necesita ser empresa para poder ayudar. Atte:NezaOfficial";

// SONIDO DING con Web Audio API - no necesita archivo
let audioCtx;
function playDing(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let o = audioCtx.createOscillator();
    let g = audioCtx.createGain();
    o.type="sine";
    o.frequency.value=880; // La
    g.gain.value=0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
    o.stop(audioCtx.currentTime + 0.6);
    // segundo ding más grave
    setTimeout(()=>{
      let o2 = audioCtx.createOscillator();
      let g2 = audioCtx.createGain();
      o2.frequency.value=659;
      g2.gain.value=0.12;
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.start();
      g2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
      o2.stop(audioCtx.currentTime + 0.5);
    },120);
  }catch(e){}
}

function mostrarAnuncio(){
  playDing();
  let a=document.getElementById("anuncioNeza");
  a.innerText=mensajeNeza;
  a.style.display="block";
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
  setTimeout(()=>{a.style.display="none";},8000);
}

setInterval(mostrarAnuncio,60000);
setTimeout(mostrarAnuncio,5000);

// resto de funciones
function generar(){
  let txt=document.getElementById("input").value.trim();
  if(!txt){alert("Escribe un poquito");return;}
  let ideas=[
    {t:"Validar", m:"Gracias por contarme lo de Monse. Se nota que te importaba mucho su amistad y duele que ya no sea la misma. No todo es tu culpa, cuando a dos les gusta el mismo niño la cosa se pone incómoda para las dos."},
    {t:"Escuchar", m:"Debe ser bien feo que te digan que todo fue tu culpa. ¿Cómo te has sentido tú con todo esto? No tienes que contar detalles si no quieres."},
    {t:"Preguntar qué necesita", m:"No tienes que arreglarlo hoy. ¿Quieres que solo te escuche un ratito, o que pensemos qué te haría sentir mejor ahora? Aquí sigo."}
  ];
  let cont=document.getElementById("respuestas");
  cont.innerHTML="";
  ideas.forEach(obj=>{
    let d=document.createElement("div");
    d.className="resp";
    d.innerHTML=`<b>${obj.t}</b>${obj.m}<div class="row"><button class="primary" style="margin-top:8px" onclick="copiar(\`${obj.m.replace(/`/g,"'")}\`)">Copiar</button></div>`;
    cont.appendChild(d);
  });
  document.getElementById("result").style.display="block";
}
function copiar(t){navigator.clipboard.writeText(t).then(()=>alert("Copiado!")); }
function limpiar(){document.getElementById("input").value="";document.getElementById("result").style.display="none";}

// para que el sonido jale en celular, necesita un primer tap
document.body.addEventListener('click', ()=>{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }, {once:true});
</script>
</body>
</html>
